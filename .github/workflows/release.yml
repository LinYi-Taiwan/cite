name: Release

# Tag-triggered: push `v0.1.0` → create a GitHub Release → cross-compile and
# upload binaries for each target. The release must exist before assets upload,
# so `create-release` runs once and the `upload` matrix depends on it.
on:
  push:
    tags:
      - v[0-9]+.*

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-24.04
    # Creating a Release needs write; the rest of CI stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Builds (cross/musl as needed), packages a tar.gz with a sha256 checksum,
      # and uploads both to the Release for the download-and-run install path.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cite
          target: ${{ matrix.target }}
          archive: cite-$tag-$target
          tar: unix
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
