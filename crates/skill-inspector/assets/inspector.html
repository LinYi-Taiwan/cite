<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skills in this project</title>
<!--INVENTORY_DATA-->
<style>
  /* shadcn-flavored zinc palette: white cards float on a gray page, every block is a
     bordered container with a tinted header band, so groups are easy to tell apart. */
  :root {
    --bg:#f4f4f5; --card:#ffffff; --subtle:#fafafa;
    --ink:#09090b; --muted:#71717a; --line:#e4e4e7; --line-strong:#d4d4d8;
    --accent:#18181b; --active:#16a34a; --folder:#d97706; --global:#dc2626; --warn:#dc2626;
    --radius:10px; --radius-sm:7px;
    --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05);
    --shadow-md:0 4px 16px -4px rgb(0 0 0 / .12);
    --ring:0 0 0 3px rgb(24 24 27 / .08);
  }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 -apple-system,'Helvetica Neue',Arial,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  header { display:flex; gap:14px; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:-.01em; }
  #search { border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:6px 11px; font-size:13px; width:280px; outline:none; background:var(--card); color:var(--ink); transition:border-color .15s, box-shadow .15s; }
  #search::placeholder { color:#a1a1aa; }
  #search:focus { border-color:#a1a1aa; box-shadow:var(--ring); }
  .meta { color:var(--muted); font-size:12px; }

  /* agent switcher: one tab per agent present in the export; scopes the whole view to one agent. */
  .agent-tabs { display:flex; gap:2px; padding:0 20px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:53px; z-index:4; }
  .agent-tabs:empty { display:none; }
  .agent-tab { appearance:none; border:none; background:none; padding:10px 15px; font:inherit; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .agent-tab:hover { color:var(--ink); }
  .agent-tab.active { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
  .agent-tab .tab-count { color:var(--muted); font-size:11px; margin-left:6px; font-weight:400; }

  main { max-width:1280px; margin:0 auto; padding:20px; }
  /* inventory: two scopes side by side — global (left) | project (right) */
  #inventory { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:860px) {
    #inventory { grid-template-columns:1fr; }
  }

  /* header tools: icon buttons (right) that open clusters / context as popovers */
  .hdr-tools { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .hdr-tool { position:relative; }
  .icon-btn { position:relative; display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; padding:0; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--card); color:var(--ink); cursor:pointer; transition:background .15s, border-color .15s, box-shadow .15s; }
  .icon-btn:hover { background:var(--subtle); }
  .icon-btn.open { background:var(--subtle); border-color:#a1a1aa; box-shadow:var(--ring); }
  .icon-btn svg { width:18px; height:18px; }
  .icon-badge { position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:var(--accent); color:#fff; font-size:10px; line-height:16px; font-weight:600; text-align:center; }
  .popover { position:absolute; top:calc(100% + 8px); right:0; width:380px; max-width:calc(100vw - 32px); max-height:70vh; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-md); display:none; z-index:40; }
  .popover.open { display:block; }
  .pop-head { position:sticky; top:0; padding:11px 14px; border-bottom:1px solid var(--line); background:var(--subtle); border-radius:var(--radius) var(--radius) 0 0; }
  .pop-head h2 { font-size:12px; margin:0; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink); }
  .pop-body { padding:12px 14px; }

  /* top-level column = a card with a tinted header band + padded body */
  section { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden; }
  .sec-head { display:flex; align-items:baseline; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line); background:var(--subtle); flex-wrap:wrap; }
  .sec-head h2 { font-size:12px; margin:0; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink); }
  .sec-note { font-size:11px; color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0; }
  .sec-body { padding:14px 16px; }

  /* source group = a nested container inside the global column, its own header band */
  .group { border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--card); overflow:hidden; }
  .group + .group { margin-top:14px; }
  .group-head { display:flex; align-items:baseline; gap:8px; padding:9px 12px; background:var(--subtle); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .group-head h3 { font-size:11px; margin:0; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .group-note { font-size:11px; color:var(--muted); }
  .group-body { padding:10px 12px; background:var(--subtle); }
  .skill-list { display:flex; flex-direction:column; gap:8px; }

  /* plugin sub-group = one installed plugin, with a whole-plugin (global) on/off toggle */
  .plugin-sub { border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--card); overflow:hidden; }
  .plugin-sub + .plugin-sub { margin-top:10px; }
  .plugin-head { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--card); }
  /* The collapse control is a real <button> (keyboard-accessible) holding the left of the header;
     the whole-plugin switch stays OUTSIDE it (an <input> inside a <button> is invalid HTML). */
  .plugin-toggle { display:flex; align-items:center; gap:8px; flex:1 1 auto; min-width:0; background:none; border:none; padding:0; margin:0; font:inherit; color:inherit; text-align:left; cursor:pointer; user-select:none; }
  .plugin-toggle:focus-visible { outline:2px solid var(--accent, #2563eb); outline-offset:2px; border-radius:4px; }
  .plugin-head .plugin-name { font-weight:600; color:var(--ink); }
  .plugin-head .plugin-tag { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .plugin-head .plugin-count { font-size:11px; color:var(--muted); }
  .plugin-head .chev { color:var(--muted); font-size:10px; transition:transform .15s; flex:0 0 auto; }
  .plugin-head .spacer { flex:0 0 auto; }
  .plugin-sub .skill-list { padding:8px 10px; background:var(--subtle); }
  /* Collapsed by default: hide the skill list, point the chevron right. */
  .plugin-sub.collapsed .skill-list { display:none; }
  .plugin-sub.collapsed .plugin-head { border-bottom:none; }
  .plugin-sub.collapsed .chev { transform:rotate(-90deg); }

  /* skill row = a white card that pops against the tinted group body */
  .skill { border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; background:var(--card); transition:border-color .15s, box-shadow .15s; }
  .skill:hover { border-color:var(--line-strong); box-shadow:var(--shadow-sm); }
  .skill .head { display:flex; align-items:center; gap:10px; }
  .skill .name { font-weight:600; cursor:pointer; color:var(--ink); flex:0 0 auto; }
  .skill .name:hover { text-decoration:underline; }
  /* path sits to the RIGHT of the name on the same row, taking the slack and truncating, so each
     card stays one line tall instead of spending a whole second row on the path. */
  .skill .loc { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0; text-align:right; }
  .skill .note { font-size:11px; color:var(--muted); margin-top:6px; }

  .badge { font-size:11px; padding:1px 7px; border-radius:999px; color:#fff; }
  .b-active { background:var(--active); } .b-folder { background:var(--folder); } .b-global { background:var(--global); }
  .b-src { background:#a1a1aa; } .b-incomplete { background:#b08968; } .b-agent { background:var(--accent); }
  .b-builtin { background:#6d28d9; }

  .empty { color:var(--muted); font-style:italic; }
  .advisory { font-size:11px; color:var(--muted); font-style:italic; margin-bottom:10px; }
  .ctx-unavail { color:var(--muted); font-style:italic; }
  .warnmsg { color:var(--warn); font-size:11px; margin-top:4px; }
  code { background:#f4f4f5; border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:12px; }

  /* overlap cluster + context entries = bordered cards */
  .cluster { border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; background:var(--subtle); }
  .cluster + .cluster { margin-top:8px; }
  .cluster .ck { font-weight:600; }
  .cluster .reason { color:var(--muted); font-size:12px; margin:3px 0; }
  .cluster ul { margin:6px 0 0; padding-left:18px; }
  #context > div + div { margin-top:8px; }
  #context ul { margin:4px 0 0; padding-left:18px; }

  /* shadcn switch */
  .switch { position:relative; display:inline-block; width:40px; height:22px; flex:0 0 auto; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; cursor:pointer; background:#d4d4d8; border-radius:999px; transition:.15s; }
  .slider:before { content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgb(0 0 0 / .2); }
  .switch input:checked + .slider { background:var(--active); }
  .switch input:checked + .slider:before { transform:translateX(18px); }
  .switch input:disabled + .slider { opacity:.45; cursor:not-allowed; }

  /* modal: click a skill name → read its SKILL.md here */
  .modal-backdrop { position:fixed; inset:0; background:rgb(9 9 11 / .5); display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; backdrop-filter:blur(2px); }
  .modal-backdrop.open { display:flex; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); width:100%; max-width:720px; max-height:80vh; display:flex; flex-direction:column; box-shadow:var(--shadow-md); }
  .modal-head { display:flex; align-items:baseline; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--subtle); border-radius:var(--radius) var(--radius) 0 0; }
  .modal-head .m-name { font-weight:600; font-size:15px; }
  .modal-head .m-path { color:var(--muted); font-size:11px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .modal-head .m-close { font-size:20px; line-height:1; padding:0 6px; border:none; background:none; color:var(--muted); cursor:pointer; border-radius:6px; }
  .modal-head .m-close:hover { color:var(--ink); background:#e4e4e7; }
  .modal-body { padding:16px; overflow:auto; }
  .md h1,.md h2,.md h3 { margin:.6em 0 .3em; line-height:1.25; }
  .md h1 { font-size:18px; } .md h2 { font-size:16px; } .md h3 { font-size:14px; }
  .md p { margin:.5em 0; } .md ul,.md ol { margin:.4em 0; padding-left:20px; }
  .md pre { background:#f4f4f5; border:1px solid var(--line); padding:10px 12px; border-radius:var(--radius-sm); overflow:auto; }
  .md pre code { background:none; border:none; padding:0; }
  .md a { color:#2563eb; }
  .md blockquote { margin:.4em 0; padding-left:10px; border-left:3px solid var(--line-strong); color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title">skills in this project</h1>
  <input id="search" type="search" aria-label="Filter skills by name or description" placeholder="filter by name or description…" autocomplete="off">
  <span class="meta" id="summary"></span>
  <span class="meta" id="projpath"></span>
  <!-- Overlap clusters + activation/context live here as click-to-open popovers, with a count
       badge so they're discoverable without scrolling to the bottom of a long inventory. -->
  <div class="hdr-tools">
    <div class="hdr-tool">
      <button class="icon-btn" id="btn-clusters" aria-haspopup="dialog" aria-expanded="false" aria-label="Overlap clusters" title="Overlap clusters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>
        <span class="icon-badge" id="badge-clusters" hidden>0</span>
      </button>
      <div class="popover" id="pop-clusters" role="dialog" aria-label="Overlap clusters">
        <div class="pop-head"><h2>Overlap clusters</h2></div>
        <div class="pop-body">
          <div class="advisory">Advisory suggestions — nothing is changed without an explicit action.</div>
          <div id="clusters"></div>
        </div>
      </div>
    </div>
    <div class="hdr-tool">
      <button class="icon-btn" id="btn-context" aria-haspopup="dialog" aria-expanded="false" aria-label="Activation and context" title="Activation &amp; context">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        <span class="icon-badge" id="badge-context" hidden>0</span>
      </button>
      <div class="popover" id="pop-context" role="dialog" aria-label="Activation and context">
        <div class="pop-head"><h2>Activation &amp; context</h2></div>
        <div class="pop-body">
          <div id="context"></div>
        </div>
      </div>
    </div>
  </div>
</header>
<nav class="agent-tabs" id="agent-tabs" role="tablist" aria-label="Agent"></nav>
<main>
  <div id="inventory"></div>
</main>

<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
  <div class="modal">
    <div class="modal-head">
      <span class="m-name" id="modal-name"></span>
      <span class="m-path" id="modal-path"></span>
      <button class="m-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
"use strict";
let EXPORT = null;
// The agent whose view is currently shown (set by the tab strip). null until the first render
// picks a default (Claude when present).
let activeAgent = null;
// Per-agent view state: search text is kept independently per tab, so switching away and back
// restores that tab's query and a query on one tab is never carried onto another (FR-004).
const viewState = {};

// Stable display label + tab ordering for the known first-class agents; unknown agents fall back
// to their raw id and sort after the known ones.
const AGENT_LABEL = { "claude-code": "Claude", "codex": "Codex", "other-agent": "Other agents" };
const AGENT_ORDER = ["claude-code", "codex", "other-agent"];
function agentLabel(a) { return AGENT_LABEL[a] || a; }
function agentRank(a) { const i = AGENT_ORDER.indexOf(a); return i === -1 ? AGENT_ORDER.length : i; }

// Distinct agents that have at least one skill, in stable order — an installed-but-skill-less agent
// contributes no tab (FR-001).
function agentsPresent() {
  const set = new Set((EXPORT.skills || []).map(s => s.agent));
  return [...set].sort((a, b) => (agentRank(a) - agentRank(b)) || a.localeCompare(b));
}

async function load() {
  if (window.__EXPORT__) { EXPORT = window.__EXPORT__; render(); return; }
  try {
    const res = await fetch("/api/inventory");
    EXPORT = await res.json();
  } catch (e) {
    document.getElementById("inventory").innerHTML = "<section><div class='empty'>Could not load inventory (static snapshot has no server).</div></section>";
    return;
  }
  render();
}

function esc(s) { return (s==null?"":String(s)).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

// Every skill is grouped by where it comes from, and every toggle is PER-REPO: it writes only
// the current project's ./.claude/settings.local.json and never touches the skill's files or any
// other repo. user/project use `skillOverrides`; plugin uses a `permissions.deny` rule.
// Group metadata is agent-aware: Claude user/project skills disable PER-REPO (skillOverrides /
// permission deny); Codex has no per-repo toggle, so a Codex user-skill disable is a reversible
// GLOBAL quarantine (FR-015) and the copy says so.
function kindMeta(kind, agent) {
  if (agent === "codex") {
    return ({
      user:    { title: "Personal / global skills", note: "Codex has no per-repo toggle — turning one off disables it GLOBALLY (all projects), reversibly, via a `[[skills.config]]` entry in ~/.codex/config.toml" },
      plugin:  { title: "Plugin skills", note: "all-or-nothing — the per-plugin switch turns the WHOLE plugin on/off for every project (writes ~/.codex/config.toml)" },
      project: { title: "This project's skills", note: "from this project's .agents/skills — turning one off disables it GLOBALLY (reversible, writes ~/.codex/config.toml)" },
    })[kind] || { title: kind, note: "" };
  }
  return ({
    project:       { title: "This project's skills", note: "from ./.claude/skills" },
    user:          { title: "Personal / global skills", note: "turning one off applies to THIS repo only — your global skill and other repos stay untouched" },
    plugin:        { title: "Plugin skills", note: "all-or-nothing — the per-plugin switch turns the WHOLE plugin on/off for every project; single plugin skills can't be toggled on their own" },
    "other-agent": { title: "Other agents", note: "no per-repo toggle for this source" },
  })[kind] || { title: kind, note: "" };
}
// Left "Global" column, in sub-heading order. "project" lives in its own right-hand column.
const GLOBAL_KINDS = ["user", "plugin", "other-agent"];

function sourceKindMap() {
  const m = {};
  (EXPORT.sources || []).forEach(s => { m[s.id] = s.kind; });
  return m;
}
function kindOf(s, kinds) {
  return kinds[s.source_id] || (/^(claude|codex):plugin:/.test(s.source_id) ? "plugin" : "other-agent");
}
// True when this skill's per-skill toggle is meaningful (renders an enabled switch). Claude
// user/project disable per-repo; a Codex user skill disables globally (quarantine). Plugins are
// all-or-nothing (whole-plugin switch — forced off in card()); other-agent has no mechanism.
function canToggleSkill(kind, agent) {
  if (agent === "codex") return kind === "user" || kind === "project";
  return kind === "project" || kind === "user";
}
// The disable scope a per-skill toggle sends: Claude user/project is folder-scoped (per-repo);
// Codex has no per-repo toggle so it is a global quarantine.
function disableScope(agent) { return agent === "codex" ? "global" : "folder"; }
// True for a plugin source id of any agent.
function pluginAgentOf(sourceId) {
  const m = /^(claude|codex):plugin:/.exec(sourceId);
  return m ? m[1] : null;
}

// Render the agent tab strip and resolve the active agent. A tab appears only for an agent with
// ≥1 skill; Claude is the default active tab when present (FR-001/002).
function renderAgentTabs() {
  const agents = agentsPresent();
  // If the active agent vanished from a refreshed export, fall back to Claude (or the first present)
  // and re-sync the search box to that agent's saved query — otherwise the box keeps the gone
  // agent's text and silently filters the new agent's list.
  if (!agents.includes(activeAgent)) {
    activeAgent = agents.includes("claude-code") ? "claude-code" : (agents[0] || null);
    const sb = document.getElementById("search");
    if (sb) sb.value = (activeAgent && viewState[activeAgent] && viewState[activeAgent].search) || "";
  }
  const counts = {};
  (EXPORT.skills || []).forEach(s => { counts[s.agent] = (counts[s.agent] || 0) + 1; });
  const nav = document.getElementById("agent-tabs");
  nav.innerHTML = agents.map(a =>
    `<button class="agent-tab${a === activeAgent ? " active" : ""}" role="tab" data-agent="${esc(a)}" aria-selected="${a === activeAgent}" tabindex="${a === activeAgent ? 0 : -1}">`
    + `${esc(agentLabel(a))}<span class="tab-count" aria-label="${counts[a] || 0} skills">${counts[a] || 0}</span></button>`
  ).join("");
}

function render() {
  // Capture the current tab's search before anything can change the active agent, so the query is
  // always persisted across re-renders and reloads (FR-004) — not just on user input / tab clicks.
  if (activeAgent) viewState[activeAgent] = { search: document.getElementById("search").value };
  renderAgentTabs();
  const q = (document.getElementById("search").value || "").toLowerCase().trim();
  const kinds = sourceKindMap();
  // Scope the whole view to the active agent first (FR-002), then apply this tab's search.
  const agentSkills = (EXPORT.skills || []).filter(s => s.agent === activeAgent);
  const filtered = agentSkills.filter(s => !q ||
    (s.name||"").toLowerCase().includes(q) || (s.description||"").toLowerCase().includes(q) || (s.id||"").toLowerCase().includes(q));

  const proj = (EXPORT.generated_for && EXPORT.generated_for.project) || "";
  const repo = proj.split("/").filter(Boolean).pop() || proj || "this project";
  document.getElementById("title").textContent = `${repo} — ${agentLabel(activeAgent || "")} skills`;
  document.getElementById("projpath").textContent = proj;
  const agentSources = (EXPORT.sources || []).filter(s => s.agent === activeAgent);
  document.getElementById("summary").textContent =
    `${agentSkills.length} skills · ${agentSources.length} sources`;

  // Group by source kind, then split into two scopes: global (everything not project-local)
  // on the left, the current project's skills on the right — so the two are easy to tell apart.
  const groups = {};
  filtered.forEach(s => { const k = kindOf(s, kinds); (groups[k] = groups[k] || []).push(s); });

  // Left column: personal + plugin + other-agent, each in its own bordered container so the
  // sources are easy to tell apart.
  let globalHtml = "";
  GLOBAL_KINDS.forEach(kind => {
    const list = groups[kind];
    if (!list || !list.length) return;
    const meta = kindMeta(kind, activeAgent);
    // Plugin skills are sub-grouped per plugin so each can carry a whole-plugin (global) toggle.
    const body = kind === "plugin"
      ? pluginGroupsHtml(list)
      : `<div class="skill-list">${list.map(s => card(s, kind)).join("")}</div>`;
    globalHtml += `<div class="group">`
                + `<div class="group-head"><h3>${esc(meta.title)}</h3>`
                + `<span class="group-note">${esc(meta.note)}</span></div>`
                + `<div class="group-body">${body}</div>`
                + `</div>`;
  });
  const globalSec = `<section><div class="sec-head"><h2>Global</h2>`
    + `<span class="sec-note">installed on this machine</span></div>`
    + `<div class="sec-body">${globalHtml || `<div class="empty">No global skills match.</div>`}</div></section>`;

  // Right column: this project's skills — shown only when the active agent has a project source
  // (Codex has none today, so its Project section is omitted rather than shown empty).
  const hasProjectSource = agentSources.some(s => s.kind === "project");
  let projSec = "";
  if (hasProjectSource) {
    const projList = groups["project"] || [];
    const projMeta = kindMeta("project", activeAgent);
    const projBody = projList.length
      ? `<div class="skill-list">${projList.map(s => card(s, "project")).join("")}</div>`
      : `<div class="empty">No project skills match.</div>`;
    projSec = `<section><div class="sec-head"><h2>Project</h2>`
      + `<span class="sec-note">${esc(projMeta.note)}</span></div>`
      + `<div class="sec-body">${projBody}</div></section>`;
  }
  const inv = document.getElementById("inventory");
  inv.style.gridTemplateColumns = hasProjectSource ? "" : "1fr";
  inv.innerHTML = globalSec + projSec;

  renderClusters();
  renderContext();
  // Badges reflect what's relevant to the active tab: clusters touching this agent, this agent's
  // context records (cross-agent clusters stay discoverable — they touch this agent too).
  const agentClusters = (EXPORT.clusters || []).filter(c =>
    c.members.some(m => m.startsWith(activeAgent + "/")));
  const agentContext = (EXPORT.context_loads || []).filter(l => l.turn_ref.startsWith(activeAgent));
  setBadge("badge-clusters", agentClusters.length);
  setBadge("badge-context", agentContext.length);
}

// Count badge on a header icon: show the number when there's content, hide it at zero so an
// empty panel doesn't draw the eye.
function setBadge(id, n) {
  const b = document.getElementById(id);
  if (!b) return;
  b.textContent = n > 99 ? "99+" : String(n);
  b.hidden = n === 0;
}

// One card: clickable name (opens the SKILL.md in a modal), the on-disk path, and a single on/off
// toggle. The toggle is "on" when active; off disables it per-repo, on re-enables. Sources with no
// per-repo mechanism render a disabled toggle. Keys/name/path ride in HTML-escaped data-* attributes.
function card(s, kind) {
  const k = esc(`${s.agent}/${s.source_id}/${s.id}`);
  const nm = esc(s.name || s.id);
  const path = esc(s.path);
  // A built-in (Codex `.system`) skill is marked, and never offered a destructive remove (FR-008);
  // it MAY still be quarantine-disabled, so its on/off toggle stays available.
  const builtinBadge = s.built_in ? `<span class="badge b-builtin" title="agent built-in — cannot be removed">built-in</span>` : "";
  const incompleteBadge = (s.metadata_complete === false) ? `<span class="badge b-incomplete" title="SKILL.md frontmatter is incomplete">incomplete</span>` : "";
  // Plugin skills are all-or-nothing (the whole-plugin switch lives on the sub-group header), so a
  // per-skill row needs no toggle — just the name (click → opens its file) and path.
  if (kind === "plugin") {
    const pluginOff = s.state === "disabled-plugin";
    const pluginNote = pluginOff
      ? `<div class="note">plugin · <strong>not enabled</strong> — this plugin is switched off, so none of its skills trigger in any project. Turn the plugin on (the switch above) to use it.</div>`
      : "";
    return `<div class="skill" data-key="${k}">
    <div class="head">
      <span class="name" data-act="open" data-key="${k}" data-name="${nm}" data-path="${path}" title="Open contents">${nm}</span>
      ${builtinBadge}${incompleteBadge}
      <span class="loc" title="${path}">${path}</span>
    </div>
    ${pluginNote}
  </div>`;
  }
  const on = s.state === "active";
  const pluginOff = s.state === "disabled-plugin";
  const can = canToggleSkill(kind, s.agent);
  const toggleable = can && !pluginOff && !window.__EXPORT__;
  // Codex user-skill disable is GLOBAL (reversible quarantine); Claude user/project is per-repo.
  const scope = disableScope(s.agent);
  const global = scope === "global";
  const title = pluginOff ? "this plugin is switched off globally — turn the plugin on to use it"
              : !can ? "no toggle for this source"
              : global ? (on ? "enabled — flip to disable GLOBALLY (all projects, reversible)" : "disabled globally — flip to re-enable")
              : (on ? "enabled — flip to disable in this repo" : "disabled in this repo — flip to enable");
  return `<div class="skill" data-key="${k}">
    <div class="head">
      <span class="name" data-act="open" data-key="${k}" data-name="${nm}" data-path="${path}" title="Open SKILL.md">${nm}</span>
      ${builtinBadge}${incompleteBadge}
      <span class="loc" title="${path}">${path}</span>
      <label class="switch" title="${esc(title)}">
        <input type="checkbox" data-act="toggle" data-key="${k}" data-scope="${scope}" aria-label="Toggle ${nm}" ${on ? "checked" : ""} ${toggleable ? "" : "disabled"}>
        <span class="slider"></span>
      </label>
    </div>
  </div>`;
}

// Which plugin sub-groups are expanded, by bare name. Lives OUTSIDE render() so the expand/collapse
// state survives a full re-render (search keystroke, toggle action) instead of snapping back closed.
const expandedPlugins = new Set();

// Plugin skills, sub-grouped by plugin. Each sub-group header carries a whole-plugin on/off switch
// that writes the GLOBAL `enabledPlugins` flag (affects every project, not just this repo). The
// switch is "on" unless every skill in the plugin is `disabled-plugin` (plugin off in settings).
function pluginGroupsHtml(list) {
  const byPlugin = {};
  list.forEach(s => { (byPlugin[s.source_id] = byPlugin[s.source_id] || []).push(s); });
  return Object.keys(byPlugin).sort().map(sourceId => {
    const skills = byPlugin[sourceId];
    const agent = pluginAgentOf(sourceId) || skills[0].agent;
    const bare = sourceId.replace(/^(claude|codex):plugin:/, "");
    // The plugin is OFF only when EVERY skill is `disabled-plugin` (the invariant: the plugin
    // enabled flag is per-plugin, so it's all-or-nothing). `.every` fails safe — any unexpected
    // state shows OFF.
    const enabled = !skills.every(s => s.state === "disabled-plugin");
    const can = !window.__EXPORT__;
    const target = agent === "codex" ? "~/.codex/config.toml enabled flag" : "enabledPlugins";
    const ttl = enabled
      ? `plugin is ON — flip to disable the WHOLE plugin for ALL projects (writes ${target}:false)`
      : `plugin is OFF — flip to enable the WHOLE plugin for ALL projects (writes ${target}:true)`;
    // Collapsed by default — many plugins each ship many skills, so an expanded list means a long
    // scroll. The header's left part is a real <button> (keyboard-accessible) that toggles the list;
    // the whole-plugin switch sits beside it (outside the button — invalid HTML otherwise).
    const open = expandedPlugins.has(bare);
    const listId = "pl-" + bare.replace(/[^a-zA-Z0-9_-]/g, "-");
    return `<div class="plugin-sub${open ? "" : " collapsed"}" data-plugin="${esc(bare)}">`
      + `<div class="plugin-head">`
      + `<button type="button" class="plugin-toggle" data-act="collapse" aria-expanded="${open}" aria-controls="${listId}" title="show or hide this plugin's skills">`
      + `<span class="chev" aria-hidden="true">▾</span>`
      + `<span class="plugin-name">${esc(bare)}</span>`
      + `<span class="plugin-count">${skills.length}</span>`
      + `<span class="plugin-tag">whole plugin · global</span>`
      + `</button>`
      + `<span class="spacer"></span>`
      + `<label class="switch" title="${esc(ttl)}">`
      + `<input type="checkbox" data-act="plugin" data-plugin="${esc(bare)}" data-agent="${esc(agent)}" aria-label="${esc(bare)} — enable or disable the whole plugin for all projects" ${enabled ? "checked" : ""} ${can ? "" : "disabled"}>`
      + `<span class="slider"></span></label>`
      + `</div>`
      + `<div class="skill-list" id="${listId}">${skills.map(s => card(s, "plugin")).join("")}</div>`
      + `</div>`;
  }).join("");
}

function renderClusters() {
  // Scope to clusters that touch the active agent — a cross-agent cluster touches this agent too,
  // so it stays discoverable here, while clusters purely among other agents are hidden (FR-011).
  const clusters = (EXPORT.clusters || []).filter(c =>
    c.members.some(m => m.startsWith(activeAgent + "/")));
  const el = document.getElementById("clusters");
  if (!clusters.length) {
    el.innerHTML = `<div class="empty">${esc(EXPORT.clusters_empty_reason || "no overlaps found")}</div>`;
    return;
  }
  el.innerHTML = clusters.map(c => `<div class="cluster">
    <div class="ck">${c.kind === "duplicate-identity" ? "Duplicate (identity)" : "Similarity"}${c.score!=null?` · ${esc(String(c.score))}`:""}</div>
    <div class="reason">${esc(c.reason)}</div>
    <ul>${c.members.map(m => `<li><code>${esc(m)}</code></li>`).join("")}</ul>
  </div>`).join("");
}

function renderContext() {
  const loads = (EXPORT.context_loads || []).filter(l => l.turn_ref.startsWith(activeAgent));
  const el = document.getElementById("context");
  let html = "";
  loads.forEach(l => {
    if (l.availability === "unavailable") {
      html += `<div class="ctx-unavail">Runtime context unavailable for <code>${esc(l.turn_ref.split(':')[0])}</code> — not fabricated.</div>`;
    } else {
      html += `<div><b>${esc(l.turn_ref)}</b>: loaded ${l.loaded_skill_keys.length} skill(s)<ul>${l.loaded_skill_keys.map(k=>`<li><code>${esc(k)}</code></li>`).join("")}</ul></div>`;
    }
  });
  el.innerHTML = html || "<div class='empty'>No context records.</div>";
}

async function post(action, payload) {
  const res = await fetch("/api/" + action, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
  return res.json();
}

// The single per-card control: flip the toggle to enable/disable. Claude user/project skills
// disable PER-REPO (scope=folder, confined to this project's settings.local.json). A Codex skill
// has no per-repo toggle, so disabling is a GLOBAL reversible quarantine (scope=global) — stated
// before applying (FR-015).
async function toggleSkill(key, enable, scope) {
  if (window.__EXPORT__) { alert("Static snapshot — run `cite serve` to change skills."); return; }
  if (!enable && scope === "global") {
    if (!confirm("Disable this skill GLOBALLY?\n\nThis turns it off for ALL projects (writes a reversible `[[skills.config]] enabled=false` entry to ~/.codex/config.toml — the skill's files stay put). You can re-enable it here. Restart Codex for it to take effect in a running session.")) {
      render(); return;
    }
  }
  await act(enable ? "enable" : "disable", key, scope);
}

// Whole-plugin switch: writes the GLOBAL plugin enabled flag for the agent (Claude `enabledPlugins`
// in settings.json, or Codex `enabled` in ~/.codex/config.toml) — every project. The global scope
// is stated BEFORE applying (FR-015); after it lands, reload so the plugin's skills flip to/from
// `disabled-plugin`, and remind the user how to refresh a running session.
async function togglePlugin(plugin, enable, agent) {
  if (window.__EXPORT__) { alert("Static snapshot — run `cite serve` to change plugins."); return; }
  const verb = enable ? "enable" : "disable";
  if (!confirm(`This will ${verb} the WHOLE "${plugin}" plugin for ALL projects (global, not just this repo). Continue?`)) {
    render(); return;
  }
  const r = await post("plugin", { plugin, enabled: enable, agent });
  if (!r.ok) { await reload(); alert("Plugin toggle failed: " + (r.error || "unknown")); return; }
  await reload();
  const refresh = agent === "codex"
    ? "Restart Codex (or refresh /skills) for it to take effect in a running session."
    : "Run /reload-plugins (or restart Claude Code) for it to take effect in your running session.";
  alert(`Plugin "${plugin}" ${enable ? "enabled" : "disabled"} globally (all projects).\n\n${refresh}`);
}

async function act(action, key, scope) {
  const payload = { skill_key: key, folder: EXPORT.generated_for.project };
  if (action === "disable") payload.scope = scope || "folder";
  const r = await post(action, payload);
  if (!r.ok) { alert("Action failed: " + (r.error || "unknown")); return; }
  if (r.warning) alert(r.warning);
  await reload();
}

// Open a modal showing the skill's SKILL.md, rendered as readable markdown.
let modalReturnFocus = null;
async function openModal(key, name, path, trigger) {
  modalReturnFocus = trigger || null;
  const modal = document.getElementById("modal");
  const body = document.getElementById("modal-body");
  document.getElementById("modal-name").textContent = name || "";
  const pathEl = document.getElementById("modal-path");
  pathEl.textContent = path || "";
  pathEl.title = path || "";
  modal.classList.add("open");
  document.getElementById("modal-close").focus();
  if (window.__EXPORT__) {
    body.innerHTML = '<div class="empty">Static snapshot — run <code>cite serve</code> to read SKILL.md.</div>';
    return;
  }
  body.innerHTML = '<div class="empty">loading…</div>';
  try {
    const res = await fetch("/api/skill?key=" + encodeURIComponent(key));
    if (!res.ok) throw new Error("not ok");
    const md = stripFrontmatter(await res.text());
    body.innerHTML = '<div class="md">' + mdToHtml(md) + '</div>';
  } catch { body.innerHTML = '<div class="empty">Could not load SKILL.md.</div>'; }
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  if (modalReturnFocus) { modalReturnFocus.focus(); modalReturnFocus = null; }
}

// Drop the leading `---`-fenced YAML frontmatter (name/description already shown on the card).
function stripFrontmatter(md) {
  const m = md.match(/^﻿?---\n[\s\S]*?\n---\n?/);
  return m ? md.slice(m[0].length) : md;
}

// Tiny, safe markdown → HTML. The source is HTML-escaped first (so any raw <script>/HTML in a
// SKILL.md is inert), then only whitelisted tags are introduced. Links restricted to http(s).
function mdToHtml(src) {
  const lines = esc(src).replace(/\r\n?/g, "\n").split("\n");
  let out = "", listType = null, inCode = false, para = [];
  const inline = (t) => t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_m, text, url) =>
      // `url` is already HTML-escaped; a `"` became `&quot;`, which the browser would decode
      // back to `"` inside href="" and break out → re-encode it (and `'`) so the attribute holds.
      `<a href="${url.replace(/&quot;/g, "%22").replace(/'/g, "%27")}" target="_blank" rel="noopener">${text}</a>`);
  const flushPara = () => { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const closeList = () => { if (listType) { out += `</${listType}>`; listType = null; } };
  for (const raw of lines) {
    if (/^```/.test(raw.trim())) {
      if (!inCode) { flushPara(); closeList(); out += "<pre><code>"; inCode = true; }
      else { out += "</code></pre>"; inCode = false; }
      continue;
    }
    if (inCode) { out += raw + "\n"; continue; }
    const line = raw.trim();
    if (line === "") { flushPara(); closeList(); continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushPara(); closeList(); const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if ((m = line.match(/^>\s?(.*)/))) { flushPara(); closeList(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if ((m = line.match(/^[-*+]\s+(.*)/))) { flushPara(); if (listType !== "ul") { closeList(); out += "<ul>"; listType = "ul"; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = line.match(/^\d+\.\s+(.*)/))) { flushPara(); if (listType !== "ol") { closeList(); out += "<ol>"; listType = "ol"; } out += `<li>${inline(m[1])}</li>`; continue; }
    para.push(line);
  }
  flushPara(); closeList(); if (inCode) out += "</code></pre>";
  return out;
}

async function reload() {
  if (window.__EXPORT__) { render(); return; } // static snapshot: no server to re-fetch
  try {
    const res = await fetch("/api/inventory");
    if (!res.ok) throw new Error("inventory fetch failed");
    EXPORT = await res.json();
  } catch (e) {
    // Transient server hiccup (e.g. a restart mid-action): keep the last good EXPORT rather
    // than corrupting it, so the next interaction doesn't crash on EXPORT.skills.
    return;
  }
  render();
}

// Search is per-agent: remember this tab's query so switching away and back restores it, and a
// query typed on one tab is never carried onto another (FR-004).
const searchEl = document.getElementById("search");
searchEl.addEventListener("input", () => {
  if (activeAgent) viewState[activeAgent] = { search: searchEl.value };
  render();
});

// Switch the active agent, preserving each tab's search box independently.
function selectAgent(next) {
  if (!next || next === activeAgent) return;
  if (activeAgent) viewState[activeAgent] = { search: searchEl.value };
  activeAgent = next;
  searchEl.value = (viewState[next] && viewState[next].search) || "";
  render();
}
const agentTabsEl = document.getElementById("agent-tabs");
agentTabsEl.addEventListener("click", (e) => {
  const tab = e.target.closest(".agent-tab");
  if (tab) selectAgent(tab.getAttribute("data-agent"));
});
// Keyboard tab pattern: ArrowLeft/Right (and Home/End) move between tabs and activate the focused
// one, as the role="tablist" contract promises.
agentTabsEl.addEventListener("keydown", (e) => {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
  const tabs = [...agentTabsEl.querySelectorAll(".agent-tab")];
  if (!tabs.length) return;
  const cur = tabs.findIndex(t => t.getAttribute("data-agent") === activeAgent);
  let idx = cur < 0 ? 0 : cur;
  if (e.key === "ArrowLeft") idx = (idx - 1 + tabs.length) % tabs.length;
  else if (e.key === "ArrowRight") idx = (idx + 1) % tabs.length;
  else if (e.key === "Home") idx = 0;
  else idx = tabs.length - 1;
  e.preventDefault();
  selectAgent(tabs[idx].getAttribute("data-agent"));
  // Focus the now-active tab (re-render replaced the nodes).
  const moved = agentTabsEl.querySelector(".agent-tab.active");
  if (moved) moved.focus();
});

const skillsEl = document.getElementById("inventory");
// Click a name → open its SKILL.md in a modal.
skillsEl.addEventListener("click", (e) => {
  const nameEl = e.target.closest('[data-act="open"]');
  if (nameEl) {
    openModal(nameEl.getAttribute("data-key"), nameEl.getAttribute("data-name"), nameEl.getAttribute("data-path"), nameEl);
    return;
  }
  // Click (or Enter/Space on) the plugin header button → collapse/expand its skill list. The button
  // sits outside the whole-plugin switch, so the switch never triggers this. Persist the open state
  // in `expandedPlugins` so a later re-render keeps it open, and keep aria-expanded in sync.
  const btn = e.target.closest('[data-act="collapse"]');
  if (btn) {
    const sub = btn.closest(".plugin-sub");
    const bare = sub.getAttribute("data-plugin");
    const collapsed = sub.classList.toggle("collapsed");
    if (collapsed) expandedPlugins.delete(bare); else expandedPlugins.add(bare);
    btn.setAttribute("aria-expanded", String(!collapsed));
  }
});
// Modal close: × button, backdrop click, Escape.
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("modal").classList.contains("open")) closeModal();
});

// Header popovers: click an icon to open its panel (clusters / context); only one open at a time.
// Closes on outside-click or Escape.
function closePopovers() {
  document.querySelectorAll(".popover.open").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".icon-btn.open").forEach(b => { b.classList.remove("open"); b.setAttribute("aria-expanded", "false"); });
}
function togglePopover(btnId, popId) {
  const btn = document.getElementById(btnId), pop = document.getElementById(popId);
  const willOpen = !pop.classList.contains("open");
  closePopovers();
  if (willOpen) { pop.classList.add("open"); btn.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
}
document.getElementById("btn-clusters").addEventListener("click", (e) => { e.stopPropagation(); togglePopover("btn-clusters", "pop-clusters"); });
document.getElementById("btn-context").addEventListener("click", (e) => { e.stopPropagation(); togglePopover("btn-context", "pop-context"); });
// Outside-click closes (clicks inside a .hdr-tool — button or popover body — keep it open).
document.addEventListener("click", (e) => { if (!e.target.closest(".hdr-tool")) closePopovers(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePopovers(); });
// Flip a toggle → enable/disable. Re-render afterwards so the switch reflects the real state
// (it snaps back if the action was cancelled or failed).
skillsEl.addEventListener("change", async (e) => {
  const pluginBox = e.target.closest('input[data-act="plugin"]');
  if (pluginBox) { await togglePlugin(pluginBox.getAttribute("data-plugin"), pluginBox.checked, pluginBox.getAttribute("data-agent")); return; }
  const box = e.target.closest('input[data-act="toggle"]');
  if (!box) return;
  await toggleSkill(box.getAttribute("data-key"), box.checked, box.getAttribute("data-scope"));
  render();
});

load();
</script>
</body>
</html>
