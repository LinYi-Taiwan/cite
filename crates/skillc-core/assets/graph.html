<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cite graph</title>
<style>
  :root {
    --page:#1d3557; --template:#457b9d; --organism:#2a9d8f; --molecule:#8ab17d;
    --external:#9b5de5; --atom:#e9c46a; --reference:#cfcfcf;
    --bg:#fafaf8; --panel:#ffffff; --ink:#222;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 -apple-system,'Helvetica Neue',Arial,sans-serif; color:var(--ink); background:var(--bg); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:14px; align-items:center; padding:8px 14px; background:#fff; border-bottom:1px solid #e3e3de; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 8px 0 0; font-weight:600; }
  .chips { display:flex; gap:6px; }
  .chip { border:1px solid #ccc; border-radius:12px; padding:2px 10px; cursor:pointer; background:#fff; font-size:12px; font:inherit; }
  .chip.on { background:var(--page); color:#fff; border-color:var(--page); }
  label.toggle { font-size:12px; display:flex; align-items:center; gap:4px; cursor:pointer; }
  #search { border:1px solid #ccc; border-radius:6px; padding:3px 8px; font-size:12px; width:180px; }
  #legend { display:flex; gap:10px; margin-left:auto; font-size:11px; align-items:center; flex-wrap:wrap; }
  #legend .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:3px; vertical-align:-1px; }
  main { flex:1; display:flex; min-height:0; position:relative; }
  #canvas { flex:1; min-width:0; cursor:grab; }
  #canvas:active { cursor:grabbing; }
  #panel { width:320px; border-left:1px solid #e3e3de; background:var(--panel); padding:14px; overflow-y:auto; display:none; }
  #panel.open { display:block; }
  #panel h2 { font-size:14px; margin:0 0 4px; word-break:break-all; }
  #panel .meta { color:#777; font-size:11px; margin-bottom:8px; }
  #panel .tag { display:inline-block; border-radius:4px; padding:1px 6px; font-size:11px; color:#fff; margin-right:4px; }
  #panel .flag { background:#c1121f; }
  #panel h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#888; margin:12px 0 4px; }
  #panel ul { margin:0; padding-left:0; list-style:none; }
  #panel li { padding:2px 0; }
  #panel a { color:var(--template); cursor:pointer; text-decoration:none; word-break:break-all; }
  #panel a:hover { text-decoration:underline; }
  #panel .desc { font-size:12px; color:#444; }
  #panel .close { float:right; cursor:pointer; color:#999; font-size:16px; line-height:1; background:none; border:none; padding:0; }
  svg text { font:11px -apple-system,'Helvetica Neue',Arial,sans-serif; pointer-events:none; }
  .node rect { cursor:pointer; }
  .node.dim { opacity:.15; }
  .edge { fill:none; }
  .edge.dim { opacity:.06; }
  .rowlabel { font-size:10px; fill:#aaa; text-transform:uppercase; letter-spacing:.08em; }
  #empty { position:absolute; top:50%; left:40%; color:#999; display:none; }

  /* mode tabs */
  .modes { display:flex; gap:2px; }
  .mode { border:1px solid #ccc; background:#fff; font:inherit; font-size:12px; padding:3px 12px; cursor:pointer; }
  .mode:first-child { border-radius:6px 0 0 6px; }
  .mode:last-child { border-radius:0 6px 6px 0; border-left:none; }
  .mode.on { background:var(--page); color:#fff; border-color:var(--page); }
  .dir { display:flex; gap:2px; }
  .dir button { border:1px solid #ccc; background:#fff; font:inherit; font-size:12px; padding:3px 10px; cursor:pointer; }
  .dir button:first-child { border-radius:6px 0 0 6px; }
  .dir button:last-child { border-radius:0 6px 6px 0; border-left:none; }
  .dir button.on { background:var(--organism); color:#fff; border-color:var(--organism); }

  /* mode visibility */
  body.mode-explorer #canvas, body.mode-explorer .graph-only { display:none; }
  body.mode-graph #explorer, body.mode-graph .exp-only { display:none; }

  /* explorer tree */
  #explorer { flex:1; min-width:0; overflow:auto; padding:12px 18px; }
  #explorer .hint { color:#999; margin:4px 0 12px; }
  #explorer .crumb { margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #explorer .crumb button { border:none; background:none; font:inherit; color:var(--template); cursor:pointer; padding:0; }
  #explorer .crumb button:hover { text-decoration:underline; }
  #explorer .crumb .cur { font-weight:600; color:var(--ink); }
  .landing { columns:3 240px; column-gap:24px; }
  .landing .lgroup { break-inside:avoid; margin-bottom:14px; }
  .landing .lgroup h4 { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#aaa; margin:0 0 4px; }
  .landing .litem { display:flex; align-items:center; gap:6px; width:100%; border:none; background:none; font:inherit; text-align:left; padding:2px 4px; cursor:pointer; border-radius:4px; }
  .landing .litem:hover { background:#eef0ec; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  ul.ttree, ul.tkids { list-style:none; margin:0; padding:0; }
  ul.tkids { padding-left:18px; border-left:1px solid #e7e7e1; margin-left:7px; }
  .trow { display:flex; align-items:center; gap:6px; padding:3px 4px; border-radius:4px; }
  .trow:hover { background:#eef0ec; }
  .trow.root { background:#e8edf1; }
  .tri { width:14px; flex:none; cursor:pointer; color:#888; text-align:center; user-select:none; }
  .tri.leaf { cursor:default; color:transparent; }
  .tname { border:none; background:none; font:inherit; cursor:pointer; padding:0; color:var(--ink); word-break:break-all; text-align:left; }
  .tname:hover { text-decoration:underline; }
  .tname.ext { font-style:italic; }
  .tbadge { font-size:10px; color:#999; flex:none; }
  .tflag { font-size:10px; color:#c1121f; flex:none; }
  .tcycle { font-size:10px; color:#c47f17; flex:none; }
</style>
</head>
<body class="mode-explorer">
<header>
  <h1>cite graph</h1>
  <div class="modes">
    <button type="button" class="mode on" data-mode="explorer">Explorer</button>
    <button type="button" class="mode" data-mode="graph">Graph</button>
  </div>
  <input id="search" type="search" placeholder="search a skill…">
  <div class="dir exp-only" id="dir">
    <button type="button" data-dir="out" class="on">imports →</button>
    <button type="button" data-dir="in">← imported by</button>
  </div>
  <div class="chips graph-only" id="targets"></div>
  <label class="toggle graph-only"><input type="checkbox" id="show-refs"> references</label>
  <label class="toggle graph-only"><input type="checkbox" id="show-atoms" checked> atoms</label>
  <div id="legend" class="graph-only"></div>
</header>
<main>
  <div id="explorer"></div>
  <svg id="canvas"></svg>
  <aside id="panel"></aside>
  <div id="empty">no nodes match the current filters</div>
</main>
<script>
const GRAPH = __GRAPH_JSON__;

// Node ids / descriptions / sources come from skill files (possibly mirrored
// third-party repos) — escape EVERY data field that lands in innerHTML.
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

const LAYERS = ["page","template","organism","molecule","atom","reference"];
const LAYER_LABEL = {page:"Pages",template:"Templates",organism:"Organisms",molecule:"Molecules",atom:"Atoms",reference:"References"};
const FILL = {page:"#1d3557",template:"#457b9d",organism:"#2a9d8f",molecule:"#8ab17d",atom:"#e9c46a",reference:"#cfcfcf"};
const DARK_TEXT = {atom:1,reference:1};
const EDGE_STYLE = {
  mounts:   {stroke:"#1d3557", width:2.2, dash:null,    arrow:true},
  imports:  {stroke:"#2a9d8f", width:1.4, dash:null,    arrow:true},
  includes: {stroke:"#b5862c", width:1.2, dash:"5,4",   arrow:true},
  hosts:    {stroke:"#bbb",    width:1,   dash:"2,3",   arrow:false},
};

const nodesById = new Map(GRAPH.nodes.map(n => [n.id, n]));
const state = { mode:"explorer", dir:"out", root:null, target:null, query:"", showRefs:false, showAtoms:true, selected:null };

// Adjacency, built once. outEdges[id] = edges leaving id (what it depends on);
// inEdges[id] = edges arriving at id (what depends on it).
const outEdges = new Map(), inEdges = new Map();
const pushMap = (m,k,v) => { const a = m.get(k); if (a) a.push(v); else m.set(k,[v]); };
for (const e of GRAPH.edges){ pushMap(outEdges, e.from, e); pushMap(inEdges, e.to, e); }
// Edges in the active direction, as {child, edge} pairs.
function childPairs(id, dir){
  const es = (dir==="out" ? outEdges.get(id) : inEdges.get(id)) || [];
  return es.map(e => ({ child: dir==="out" ? e.to : e.from, edge: e }));
}

// ---------- header ----------
const targetNames = GRAPH.nodes.filter(n => n.kind==="target").map(n => n.id);
const chipsEl = document.getElementById("targets");
function mkChip(label, value){
  const c = document.createElement("button");
  c.type = "button";
  c.className = "chip"; c.textContent = label;
  c.onclick = () => { state.target = value; syncChips(); update(); };
  c.dataset.value = value ?? "";
  chipsEl.appendChild(c);
}
mkChip("all", null);
targetNames.forEach(t => mkChip(t, t));
function syncChips(){
  for (const c of chipsEl.children) c.classList.toggle("on", (c.dataset.value||null) === state.target);
}
syncChips();

const legendEl = document.getElementById("legend");
for (const l of LAYERS) {
  const present = GRAPH.nodes.some(n => n.layer===l);
  if (!present) continue;
  const s = document.createElement("span");
  s.innerHTML = `<span class="sw" style="background:${FILL[l]}"></span>${l}`;
  legendEl.appendChild(s);
}
if (GRAPH.nodes.some(n => n.external)) {
  const s = document.createElement("span");
  s.innerHTML = `<span class="sw" style="background:#fff;border:1.5px dashed #555"></span>external`;
  legendEl.appendChild(s);
}

document.getElementById("search").oninput = e => {
  state.query = e.target.value.trim().toLowerCase();
  if (state.mode === "explorer"){ state.root = null; renderExplorer(); } else { update(); }
};
document.getElementById("show-refs").onchange = e => { state.showRefs = e.target.checked; update(); };
document.getElementById("show-atoms").onchange = e => { state.showAtoms = e.target.checked; update(); };

// ---------- mode + direction switching ----------
for (const b of document.querySelectorAll(".mode")){
  b.onclick = () => setMode(b.dataset.mode);
}
for (const b of document.querySelectorAll("#dir button")){
  b.onclick = () => {
    state.dir = b.dataset.dir;
    for (const x of document.querySelectorAll("#dir button")) x.classList.toggle("on", x===b);
    renderExplorer();
  };
}
function setMode(mode){
  state.mode = mode;
  document.body.classList.toggle("mode-explorer", mode==="explorer");
  document.body.classList.toggle("mode-graph", mode==="graph");
  for (const b of document.querySelectorAll(".mode")) b.classList.toggle("on", b.dataset.mode===mode);
  if (mode==="explorer") renderExplorer(); else update();
}

// ---------- filtering ----------
function visibleNodes(){
  return GRAPH.nodes.filter(n => {
    if (n.layer==="reference" && !state.showRefs) return false;
    if (n.layer==="atom" && !state.showAtoms) return false;
    if (state.target) {
      if (n.kind==="target") { if (n.id!==state.target) return false; }
      else if (!(n.targets||[]).includes(state.target)) return false;
    }
    return true;
  });
}

// ---------- layout: layered rows, barycenter ordering ----------
const NODE_H = 26, ROW_GAP = 110, X_GAP = 18, PAD = 60;
function measure(id){ return Math.max(60, id.length*6.4 + 18); }

function layout(nodes, edges){
  const rows = LAYERS.map(l => nodes.filter(n => n.layer===l)).filter(r => r.length);
  const pos = new Map();
  // initial order: alphabetical (stable), then a few barycenter sweeps
  rows.forEach(r => r.sort((a,b) => a.id.localeCompare(b.id)));
  const idx = new Map();
  const reindex = () => rows.forEach(r => r.forEach((n,i) => idx.set(n.id, i)));
  reindex();
  const neighbors = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges){
    if (neighbors.has(e.from) && neighbors.has(e.to)){
      neighbors.get(e.from).push(e.to);
      neighbors.get(e.to).push(e.from);
    }
  }
  for (let sweep=0; sweep<4; sweep++){
    for (const r of rows){
      const bary = n => {
        const ns = neighbors.get(n.id).filter(m => idx.has(m));
        if (!ns.length) return idx.get(n.id);
        return ns.reduce((s,m) => s+idx.get(m), 0)/ns.length;
      };
      r.sort((a,b) => bary(a)-bary(b) || a.id.localeCompare(b.id));
      reindex();
    }
  }
  let maxW = 0;
  const rowYs = [];
  rows.forEach((r,ri) => {
    const widths = r.map(n => measure(n.id));
    const total = widths.reduce((a,b)=>a+b,0) + X_GAP*(r.length-1);
    maxW = Math.max(maxW, total);
    rowYs.push(PAD + ri*ROW_GAP);
  });
  rows.forEach((r,ri) => {
    const widths = r.map(n => measure(n.id));
    const total = widths.reduce((a,b)=>a+b,0) + X_GAP*(r.length-1);
    let x = PAD + (maxW-total)/2;
    r.forEach((n,i) => {
      pos.set(n.id, {x, y:rowYs[ri], w:widths[i], h:NODE_H, layer:n.layer});
      x += widths[i] + X_GAP;
    });
  });
  return {pos, rows, width: maxW + PAD*2, height: PAD*2 + (rows.length-1)*ROW_GAP + NODE_H};
}

// ---------- render ----------
const svg = document.getElementById("canvas");
const SVGNS = "http://www.w3.org/2000/svg";
let view = {x:0, y:0, k:1};

function el(name, attrs, parent){
  const e = document.createElementNS(SVGNS, name);
  for (const [k,v] of Object.entries(attrs||{})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function update(){
  if (state.mode !== "graph") return; // graph is hidden in explorer mode — skip the work
  svg.innerHTML = "";
  const nodes = visibleNodes();
  const visIds = new Set(nodes.map(n => n.id));
  const edges = GRAPH.edges.filter(e => visIds.has(e.from) && visIds.has(e.to));
  document.getElementById("empty").style.display = nodes.length ? "none" : "block";
  if (!nodes.length) return;

  const {pos, rows, width, height} = layout(nodes, edges);

  const defs = el("defs", {}, svg);
  for (const [kind, st] of Object.entries(EDGE_STYLE)){
    const m = el("marker", {id:"arr-"+kind, viewBox:"0 0 10 10", refX:9, refY:5, markerWidth:6, markerHeight:6, orient:"auto-start-reverse"}, defs);
    el("path", {d:"M0,0 L10,5 L0,10 z", fill:st.stroke}, m);
  }
  const root = el("g", {id:"root"}, svg);

  // row labels
  rows.forEach((r) => {
    const y = pos.get(r[0].id).y;
    const t = el("text", {x:8, y:y+NODE_H/2+4, class:"rowlabel"}, root);
    t.textContent = LAYER_LABEL[r[0].layer];
  });

  // neighbor map for highlight
  const inc = new Map(nodes.map(n => [n.id, new Set([n.id])]));
  for (const e of edges){ inc.get(e.from).add(e.to); inc.get(e.to).add(e.from); }

  const matches = id => !state.query || id.toLowerCase().includes(state.query);
  const focusSet = state.selected && visIds.has(state.selected) ? inc.get(state.selected) : null;

  // edges under nodes
  for (const e of edges){
    const a = pos.get(e.from), b = pos.get(e.to);
    const st = EDGE_STYLE[e.kind] || EDGE_STYLE.imports;
    const x1 = a.x+a.w/2, x2 = b.x+b.w/2;
    let d;
    if (Math.abs(a.y-b.y) < 1){ // same row: arc above
      const lift = 36 + Math.abs(x2-x1)*0.06;
      d = `M${x1},${a.y} C${x1},${a.y-lift} ${x2},${b.y-lift} ${x2},${b.y}`;
    } else {
      const [sy, ty] = a.y < b.y ? [a.y+a.h, b.y] : [a.y, b.y+b.h];
      const mid = (sy+ty)/2;
      d = `M${x1},${sy} C${x1},${mid} ${x2},${mid} ${x2},${ty}`;
    }
    const dim = focusSet && !(focusSet.has(e.from) && focusSet.has(e.to));
    const p = el("path", {d, class:"edge"+(dim?" dim":""), stroke:st.stroke, "stroke-width":st.width}, root);
    if (st.dash) p.setAttribute("stroke-dasharray", st.dash);
    if (st.arrow) p.setAttribute("marker-end", `url(#arr-${e.kind})`);
    if (e.alias) { const t = el("title", {}, p); t.textContent = `${e.kind} {{${e.alias}}}`; }
    else { const t = el("title", {}, p); t.textContent = e.kind; }
  }

  // nodes
  for (const n of nodes){
    const p = pos.get(n.id);
    const dim = (focusSet && !focusSet.has(n.id)) || !matches(n.id);
    const g = el("g", {class:"node"+(dim?" dim":"")}, root);
    const r = el("rect", {x:p.x, y:p.y, width:p.w, height:p.h, rx:6, fill:FILL[n.layer]}, g);
    if (n.flags && n.flags.length){ r.setAttribute("stroke", "#c1121f"); r.setAttribute("stroke-width", "2.5"); }
    else if (n.id === state.selected){ r.setAttribute("stroke", "#222"); r.setAttribute("stroke-width", "2"); }
    if (n.external) { r.setAttribute("stroke-dasharray", "4,3"); if (!n.flags || !n.flags.length) { r.setAttribute("stroke", "#555"); r.setAttribute("stroke-width", "1.4"); } }
    const t = el("text", {x:p.x+p.w/2, y:p.y+p.h/2+4, "text-anchor":"middle", fill:DARK_TEXT[n.layer]?"#333":"#fff"}, g);
    t.textContent = n.id;
    const tip = el("title", {}, g);
    tip.textContent = [n.id, n.description, n.flags?.length?("⚠ "+n.flags.join(", ")):null].filter(Boolean).join("\n");
    g.onclick = ev => { ev.stopPropagation(); select(n.id); };
  }

  svg.dataset.w = width; svg.dataset.h = height;
  applyView();
}

function applyView(){
  const w = +svg.dataset.w || 1000, h = +svg.dataset.h || 600;
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${w/view.k} ${h/view.k}`);
}

// pan + zoom
let drag = null;
svg.addEventListener("mousedown", e => { drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y}; });
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const scale = (+svg.dataset.w||1000)/view.k/svg.clientWidth;
  view.x = drag.vx - (e.clientX-drag.x)*scale;
  view.y = drag.vy - (e.clientY-drag.y)*scale;
  applyView();
});
window.addEventListener("mouseup", () => drag = null);
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  const k2 = Math.min(8, Math.max(0.2, view.k*factor));
  // Anchor the zoom on the cursor: keep its graph-space point fixed.
  const rect = svg.getBoundingClientRect();
  const w = +svg.dataset.w || 1000;
  const gx = view.x + (e.clientX-rect.left)/rect.width * (w/view.k);
  const gy = view.y + (e.clientY-rect.top)/rect.width * (w/view.k); // viewBox scale is width-driven
  view.x = gx - (e.clientX-rect.left)/rect.width * (w/k2);
  view.y = gy - (e.clientY-rect.top)/rect.width * (w/k2);
  view.k = k2;
  applyView();
}, {passive:false});
// Deselect only on true background clicks — not as a fallthrough from node clicks.
svg.addEventListener("click", e => { if (!e.target.closest(".node")) select(null); });

// ---------- detail panel (the inline `why` view) ----------
const panel = document.getElementById("panel");
function select(id){
  if (id && !nodesById.has(id)) return;
  state.selected = id;
  if (!id){ panel.classList.remove("open"); update(); return; }
  const n = nodesById.get(id);
  const inn = GRAPH.edges.filter(e => e.to===id);
  const out = GRAPH.edges.filter(e => e.from===id);
  const link = nid => `<a data-nav="${esc(nid)}">${esc(nid)}</a>`;
  const group = (edges, dir) => {
    const byKind = {};
    for (const e of edges) (byKind[e.kind] ||= []).push(e);
    return Object.entries(byKind).map(([kind, es]) => `
      <h3>${dir} · ${esc(kind)}</h3>
      <ul>${es.map(e => `<li>${link(dir==="in"?e.from:e.to)}${e.alias?` <span style="color:#999">{{${esc(e.alias)}}}</span>`:""}</li>`).join("")}</ul>
    `).join("");
  };
  panel.innerHTML = `
    <button type="button" class="close" data-close>×</button>
    <h2>${esc(n.id)}</h2>
    <div class="meta">${esc(n.kind)} · ${esc(n.layer)}${n.external?" · external":""}${n.refKind?` · ${esc(n.refKind)}`:""}${n.source?`<br>${esc(n.source)}`:""}</div>
    ${(n.flags||[]).map(f => `<span class="tag flag">${esc(f)}</span>`).join("")}
    ${n.description ? `<p class="desc">${esc(n.description)}</p>` : ""}
    ${n.targets && n.targets.length ? `<h3>ships in targets</h3><ul><li>${esc(n.targets.join(", "))}</li></ul>` : (n.kind!=="target" ? `<h3>ships in targets</h3><ul><li style="color:#999">(none)</li></ul>` : "")}
    ${group(inn, "in")}${group(out, "out")}
  `;
  panel.classList.add("open");
  panel.querySelectorAll("[data-nav]").forEach(a => a.onclick = () => navTo(a.dataset.nav));
  panel.querySelector("[data-close]").onclick = () => select(null);
  update();
}

// Navigate to a node: in explorer mode also re-root the tree there so panel links
// and the tree stay in sync; in graph mode just select.
function navTo(id){
  if (state.mode === "explorer" && nodesById.has(id)) setRoot(id);
  else select(id);
}

// ---------- explorer (search → expandable dependency tree) ----------
const explorerEl = document.getElementById("explorer");

function dot(layer, external){
  const d = document.createElement("span");
  d.className = "dot";
  d.style.background = FILL[layer] || "#ccc";
  if (external){ d.style.background = "#fff"; d.style.border = "1.5px dashed #555"; }
  return d;
}

function setRoot(id){
  state.root = id;
  renderExplorer();
  select(id); // also surface full detail in the side panel
}

function renderExplorer(){
  explorerEl.innerHTML = "";
  if (!state.root){ renderLanding(); return; }
  if (!nodesById.has(state.root)){ state.root = null; renderLanding(); return; }

  const n = nodesById.get(state.root);
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  const back = document.createElement("button");
  back.type = "button"; back.textContent = "← all skills";
  back.onclick = () => { state.root = null; renderExplorer(); };
  const cur = document.createElement("span");
  cur.className = "cur"; cur.textContent = n.id;
  const dirLabel = document.createElement("span");
  dirLabel.style.color = "#999";
  dirLabel.textContent = state.dir === "out" ? "— what it depends on" : "— what depends on it";
  crumb.append(back, document.createTextNode("/"), cur, dirLabel);
  explorerEl.appendChild(crumb);

  const tree = document.createElement("ul");
  tree.className = "ttree";
  tree.appendChild(rootRow(n));
  explorerEl.appendChild(tree);
}

// The root node's own row, expanded by default.
function rootRow(n){
  const li = document.createElement("li");
  const row = document.createElement("div");
  row.className = "trow root";
  row.append(triPlaceholder(), dot(n.layer, n.external), nameBtn(n, true), ...badges(n, null));
  li.appendChild(row);
  const kids = document.createElement("ul");
  kids.className = "tkids";
  const pairs = childPairs(n.id, state.dir);
  if (!pairs.length){
    const empty = document.createElement("li");
    empty.style.color = "#999"; empty.style.padding = "3px 4px";
    empty.textContent = state.dir === "out" ? "(depends on nothing)" : "(nothing depends on it)";
    kids.appendChild(empty);
  } else {
    const anc = new Set([n.id]);
    for (const p of pairs) kids.appendChild(treeRow(p.child, p.edge, anc));
  }
  li.appendChild(kids);
  return li;
}

// A child row: lazy-expandable, cycle-guarded against its ancestor path.
function treeRow(id, edge, ancestors){
  const n = nodesById.get(id);
  const li = document.createElement("li");
  const row = document.createElement("div");
  row.className = "trow";

  const pairs = childPairs(id, state.dir);
  const cycle = ancestors.has(id);
  const expandable = pairs.length > 0 && !cycle;

  const tri = document.createElement("span");
  tri.className = "tri" + (expandable ? "" : " leaf");
  tri.textContent = expandable ? "▸" : "•";

  row.append(tri, dot(n ? n.layer : "reference", n && n.external), nameBtn(n || {id}, false), ...badges(n, edge, cycle));
  li.appendChild(row);

  const kids = document.createElement("ul");
  kids.className = "tkids";
  kids.style.display = "none";
  li.appendChild(kids);

  let built = false;
  tri.onclick = () => {
    if (!expandable) return;
    const open = kids.style.display !== "none";
    kids.style.display = open ? "none" : "block";
    tri.textContent = open ? "▸" : "▾";
    if (!built){
      built = true;
      const anc = new Set(ancestors); anc.add(id);
      for (const p of pairs) kids.appendChild(treeRow(p.child, p.edge, anc));
    }
  };
  return li;
}

function triPlaceholder(){
  const t = document.createElement("span");
  t.className = "tri leaf"; t.textContent = "•";
  return t;
}

function nameBtn(n, isRoot){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tname" + (n.external ? " ext" : "");
  b.textContent = n.id;
  if (!isRoot) b.onclick = () => setRoot(n.id);
  else b.onclick = () => select(n.id);
  return b;
}

function badges(n, edge, cycle){
  const out = [];
  if (edge){
    const b = document.createElement("span");
    b.className = "tbadge";
    b.textContent = edge.alias ? `${edge.kind} {{${edge.alias}}}` : edge.kind;
    out.push(b);
  }
  if (n && n.flags && n.flags.length){
    const f = document.createElement("span");
    f.className = "tflag"; f.textContent = "⚠ " + n.flags.join(",");
    out.push(f);
  }
  if (cycle){
    const c = document.createElement("span");
    c.className = "tcycle"; c.textContent = "↻ cycle";
    out.push(c);
  }
  return out;
}

function renderLanding(){
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "Pick a skill to see what it imports — or search above. Click a name to walk into its dependencies.";
  explorerEl.appendChild(hint);

  const wrap = document.createElement("div");
  wrap.className = "landing";
  const q = state.query;
  for (const layer of LAYERS){
    const items = GRAPH.nodes
      .filter(n => n.layer === layer && (n.kind === "skill" || n.kind === "target"))
      .filter(n => !q || n.id.toLowerCase().includes(q))
      .sort((a,b) => a.id.localeCompare(b.id));
    if (!items.length) continue;
    const g = document.createElement("div");
    g.className = "lgroup";
    const h = document.createElement("h4");
    h.textContent = LAYER_LABEL[layer];
    g.appendChild(h);
    for (const n of items){
      const b = document.createElement("button");
      b.type = "button"; b.className = "litem";
      b.append(dot(n.layer, n.external), document.createTextNode(n.id));
      b.onclick = () => setRoot(n.id);
      g.appendChild(b);
    }
    wrap.appendChild(g);
  }
  if (!wrap.children.length){
    const none = document.createElement("p");
    none.className = "hint"; none.textContent = "no skill matches your search";
    explorerEl.appendChild(none);
  } else {
    explorerEl.appendChild(wrap);
  }
}

renderExplorer();
</script>
</body>
</html>
