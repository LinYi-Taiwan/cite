# PM suite — 兩條互相關聯的產品線：loyalty（會員點數）與 checkout（結帳）。
# 關聯：折抵 UI 嵌在 checkout 流程內；checkout 的訂單完成事件是 loyalty 累點的唯一來源。
targets:
  loyalty:
    entry:
      mounts: [prd-writing, cross-product-impact]
    defaultAgent: claude
  checkout:
    entry:
      mounts: [prd-writing, cross-product-impact]
    defaultAgent: claude

agents: [claude]

sharedReferences: [glossary]
