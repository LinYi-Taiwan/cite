# Workspace manifest for `cite` — the Skill & Context Inspector.
# A single crate: scan installed AI-agent skills, surface overlaps, and toggle them per-repo
# from a loopback control-panel UI.
[workspace]
resolver = "2"
members = ["crates/skill-inspector"]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/LinYi-Taiwan/cite"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
# Format-preserving TOML editor — flips only the `enabled` flag in the Codex `config.toml`
# (003-codex-skill-support, research §4), leaving the user's comments/ordering byte-stable.
toml_edit = "0.22"
insta = { version = "1", features = ["yaml", "json"] }

[profile.release]
# Strip symbols to keep the `cite` binary lean.
strip = true
